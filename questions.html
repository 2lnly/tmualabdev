<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question bank — TMUA Lab</title>
<meta name="description" content="Browse and search every question in the TMUA Lab bank, with full worked answers.">
<meta name="theme-color" content="#0a0e12">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2354d8f0'/><text y='72' x='50' text-anchor='middle' font-size='62' font-family='monospace' font-weight='bold' fill='%2303151b'>T</text></svg>">
<link rel="stylesheet" href="assets/css/fonts.css">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header id="hdr"></header>
<main id="main">
  <div class="wrap">
    <div class="app-head">
      <div class="eyebrow">06 — question bank</div>
      <h1 style="margin-top:14px">The bank</h1>
      <p>Every question on the site, with its worked answer. Reading answers is not practice — but it is the fastest
        way to check a question you think is wrong, and to see how a topic is examined.</p>
    </div>

    <div class="bank-tools">
      <input type="search" id="bankSearch" placeholder="Search the bank…" aria-label="Search questions">
      <select id="bankPaper" aria-label="Paper"><option value="">Both papers</option><option value="1">Paper 1</option><option value="2">Paper 2</option></select>
      <select id="bankTopic" aria-label="Topic"></select>
      <select id="bankSrc" aria-label="Source">
        <option value="">All questions</option>
        <option value="past">Real past papers</option>
        <option value="lab">Written for this site</option>
      </select>
      <select id="bankDiff" aria-label="Difficulty">
        <option value="">Any difficulty</option>
        <option value="hard">Hard questions only</option>
        <option value="1">Routine</option><option value="3">Middling</option><option value="5">Brutal</option>
      </select>
    </div>
    <div class="muted mono" id="bankCount" style="font-size:12px;margin-bottom:10px"></div>
    <div class="panel" id="bankList" style="overflow:hidden"></div>
  </div>
</main>
<footer id="ftr"></footer>
<script src="assets/js/math.js"></script>
<script src="assets/js/bank-past.js"></script>
<script src="assets/js/bank-p1.js"></script>
<script src="assets/js/bank-p2.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/session.js"></script>
<script src="assets/js/questions.js"></script>
</body>
</html>
